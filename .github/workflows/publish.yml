name: Publish to npm

# Trusted publishing (OIDC) — no NPM_TOKEN secret needed, PROVIDED that npm's
# trusted publisher for @turbolego/oldmilk is configured with:
#   Repository owner: turbolego | Repository: OldMilk | Workflow filename: publish.yml
#   (filename only, not the full .github/workflows/ path) | Environment: <blank>
# Configure at: https://www.npmjs.com/package/@turbolego/oldmilk/access
# If NPM_TOKEN is set as a repo secret, it is used instead of OIDC (e.g. for
# the very first publish of a scoped package, which OIDC cannot bootstrap).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm 11.5.1+; setup-node's bundled npm may be older.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      # Bumps the patch version until it finds one not already on npm, so
      # re-running or forgetting to bump the version never breaks publish.
      - name: Bump version if already published
        run: |
          PKG=$(node -p "require('./package.json').name")
          while npm view "$PKG@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; do
            npm version patch --no-git-tag-version
          done
          echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Commit version bump
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
            git push
          fi

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
