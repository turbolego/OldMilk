<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>OldMilk — WebGL1 Milkdrop-style visualizer (iPad 2 / iOS 9.3.5)</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background: #111; color: #eee; }
  header, main { padding: 16px 20px; max-width: 600px; margin: 0 auto; }
  main { text-align: center; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.desc { font-size: 12px; color: #9cf; margin: 0 0 12px; }
  .canvas-wrap { width: 100%; max-width: 275px; margin: 0 auto; }
  #milkdrop-canvas { width: 100%; height: auto; display: block; background: #000; border: 1px solid #333; }
  .controls { margin: 12px 0; }
  .controls, .field { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center; -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
  .field { margin-bottom: 8px; }
  .field label { font-size: 12px; margin-right: 6px; }
  button, select { background: #222; color: #eee; border: 1px solid #444; padding: 8px 12px; margin: 4px; font-size: 13px; -webkit-appearance: none; appearance: none; border-radius: 4px; }
  button { min-width: 44px; min-height: 44px; }
  button.on { background: #2a6; }
  .note { font-size: 11px; color: #888; margin-top: 12px; }
  @media (min-width: 480px) {
    .canvas-wrap { max-width: 400px; }
  }
</style>
</head>
<body>
<header>
  <h1>OldMilk — Milkdrop-style visualizer</h1>
  <p class="desc">ES5 + WebGL 1 · runs on iPad 2 / iOS 9.3.5 Safari · falls back to Canvas 2D</p>
</header>
<main>
  <div class="canvas-wrap">
    <canvas id="milkdrop-canvas" width="275" height="116"></canvas>
  </div>
  <div class="controls">
    <span class="field">
      <label for="preset">Preset</label>
      <select id="preset">
        <option>Geiss - Blue Fusion</option>
        <option>Geiss - Spiky</option>
        <option>Flexi - Hypno</option>
        <option>Mercury - Wave</option>
        <option>Euphoric - Lights</option>
        <option>Martin - Tunnel Vision</option>
        <option>Aderrasi - Starfield</option>
      </select>
    </span>
    <button id="tone">Test Tone</button>
    <button id="song">Play Song</button>
  </div>
  <p class="note" id="note"></p>
  <p class="note">Song: Edvard Grieg — Peer Gynt Suite No. 1, Op. 46: In the Hall of the Mountain King. Public domain, courtesy of <a href="https://musopen.org/music/777-peer-gynt-suite-no-1-op-46/" style="color:#9cf;">Musopen</a>.</p>
  <audio id="song-audio" src="audio/Grieg - Peer Gynt Suite No. 1 - In the Hall of the Mountain King.mp3" preload="none"></audio>
</main>

<script src="src/oldmilk.js"></script>
<script>
(function () {
  var canvas = document.getElementById('milkdrop-canvas');
  var viz = OldMilk.createVisualizer(canvas, { width: 275, height: 116 });
  var audioCtx = null, osc = null, gain = null, analyser = null, lfo = null, toneOn = false;
  var songAudio = document.getElementById('song-audio');
  var songCtx = null, songAnalyser = null, songSource = null, songOn = false;

  function stopSong() {
    if (!songOn) return;
    songAudio.pause();
    songOn = false;
    document.getElementById('song').innerHTML = 'Play Song';
  }

  document.getElementById('note').innerHTML = viz.isWebGL() ? 'WebGL 1 mode' : 'Canvas 2D fallback mode';
  document.getElementById('tone').onclick = function () {
    if (toneOn) {
      try { lfo.stop(); } catch(e) {}
      try { osc.stop(); } catch(e) {}
      try { audioCtx.close(); } catch(e) {}
      osc = gain = analyser = audioCtx = lfo = null; toneOn = false;
      viz.setAudioSource(null);
      document.getElementById('tone').innerHTML = 'Test Tone';
      document.getElementById('note').innerHTML = 'Synthetic mode';
    } else {
      stopSong();
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; }
      osc = audioCtx.createOscillator();
      gain = audioCtx.createGain();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256; gain.gain.value = 0.15;
      osc.frequency.value = 110;
      osc.type = 'sawtooth';
      osc.connect(gain); gain.connect(analyser); analyser.connect(audioCtx.destination);
      lfo = audioCtx.createOscillator();
      var lfoGain = audioCtx.createGain();
      lfo.frequency.value = 4; lfoGain.gain.value = 60;
      lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
      osc.start(); lfo.start();
      viz.setAudioSource(analyser);
      toneOn = true;
      document.getElementById('tone').innerHTML = 'Stop Tone';
      document.getElementById('note').innerHTML = 'Web Audio mode';
    }
  };

  document.getElementById('preset').onchange = function () { viz.loadPreset(this.value); };

  document.getElementById('song').onclick = function () {
    if (songOn) {
      stopSong();
      viz.setAudioSource(null);
      document.getElementById('note').innerHTML = 'Synthetic mode';
      return;
    }
    if (toneOn) { document.getElementById('tone').onclick(); }
    if (!songCtx) { try { songCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; } }
    if (!songSource) {
      songSource = songCtx.createMediaElementSource(songAudio);
      songAnalyser = songCtx.createAnalyser();
      songAnalyser.fftSize = 256;
      songSource.connect(songAnalyser);
      songAnalyser.connect(songCtx.destination);
    }
    songAudio.currentTime = 0;
    songAudio.play();
    viz.setAudioSource(songAnalyser);
    songOn = true;
    document.getElementById('song').innerHTML = 'Stop Song';
    document.getElementById('note').innerHTML = 'Song playback mode';
  };
  songAudio.onended = function () {
    stopSong();
    viz.setAudioSource(null);
    document.getElementById('note').innerHTML = 'Synthetic mode';
  };


  function loop() {
    viz.render();
    if (window.requestAnimationFrame) requestAnimationFrame(loop);
    else setTimeout(loop, 16);
  }
  loop();
})();
</script>
</body>
</html>
